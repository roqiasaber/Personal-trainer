<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
    <link rel="stylesheet" href="booking.css">


     <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <section class="form-section">

        <h2>احجز خطة التدريب الخاصة بك</h2>

        <form>

            <input type="text" placeholder="الاسم الكامل" required>

            <input type="number" placeholder="العمر" required>

            <input type="number" placeholder="الوزن(كجم)" required>

            <input type="number" placeholder="الطول(سم)" required>

            <input type="tel" placeholder="رقم الهاتف" required>

            <input type="email" placeholder="عنوان البريد الاكتروني" required>

            <button type="submit">ارسال</button>

        </form>

    </section>

</body>
</html>
